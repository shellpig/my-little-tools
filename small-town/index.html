<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小鎮</title>
<style>
  :root {
    --panel: rgba(16, 20, 30, .72);
    --line: rgba(255, 255, 255, .09);
    --text: #e8ecf3;
    --dim: #8a93a6;
    --accent: #ffd27a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  canvas { display: block; }
  .title { position: fixed; left: 28px; top: 22px; pointer-events: none; }
  .title h1 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 2px; color: #fff;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
  .title p { margin: 6px 0 0; font-size: 14px; color: #c9d1e0; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
  .panel { position: fixed; right: 20px; bottom: 20px; width: 300px; padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(12px); }
  .clock { display: flex; align-items: baseline; gap: 10px; }
  .clock b { font: 600 34px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .clock span { font-size: 13px; color: var(--dim); }
  .toggle { margin-left: auto; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(255, 255, 255, .04); color: var(--text); font-size: 15px; cursor: pointer; }
  .toggle:hover { background: rgba(255, 255, 255, .1); }
  .panel.collapsed { width: auto; }
  .panel.collapsed #controls { display: none; }
  input[type=range] { width: 100%; margin: 14px 0 12px; accent-color: var(--accent); }
  .row { display: flex; gap: 6px; }
  .row + .row { margin-top: 6px; }
  .row button { flex: 1; padding: 7px 0; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    background: rgba(255, 255, 255, .04); color: var(--text); font-family: inherit; font-size: 13px; }
  .row button:hover { background: rgba(255, 255, 255, .1); }
  .row button.on { background: #f3f5f9; color: #111; }
  .hint { margin-top: 10px; font-size: 12px; color: var(--dim); }
  .bubble { position: fixed; z-index: 5; max-width: 220px; padding: 9px 12px 10px; pointer-events: none;
    transform: translate(-50%, calc(-100% - 12px)); background: rgba(250, 248, 243, .96); color: #1d2230;
    border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .28); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(250, 248, 243, .96); }
  .bubble b { font-size: 14px; }
  .bubble span { margin-left: 6px; font-size: 12px; color: #6b7280; }
  .bubble p { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
  .cats { position: fixed; right: 20px; top: 20px; width: 236px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(12px); }
  .cats-head { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .cats-head b { color: var(--accent); }
  .cats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 8px; }
  .chip { display: grid; place-items: center; height: 28px; border-radius: 8px; font-size: 12px; font-weight: 700;
    color: var(--dim); background: rgba(255, 255, 255, .06); border: 1px dashed rgba(255, 255, 255, .18); }
  .chip.found { border: 1px solid rgba(255, 255, 255, .35); text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
  .chip.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .cats-row.wishes { grid-template-columns: repeat(5, 1fr); }
  .cats-row.wishes .chip { font-size: 16px; }
  .cats-total { font-size: 12px; color: var(--dim); }
  .banner { position: fixed; left: 50%; top: 22px; z-index: 7; padding: 10px 20px; border-radius: 999px;
    font-size: 16px; font-weight: 800; color: #1d2230; background: #fffaf0; pointer-events: none;
    box-shadow: 0 0 0 3px var(--glow, #ffd166), 0 8px 30px rgba(0, 0, 0, .35);
    opacity: 0; transform: translate(-50%, -30px) scale(.9); transition: opacity .35s, transform .35s; }
  .banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .heart { position: fixed; z-index: 6; font-size: 20px; pointer-events: none; animation: float 1.3s ease-out both;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  @keyframes float {
    from { opacity: 0; transform: translate(-50%, 0) scale(.5); }
    20% { opacity: 1; transform: translate(-50%, -20px) scale(1.15); }
    to { opacity: 0; transform: translate(calc(-50% + var(--drift)), -110px) scale(.9); }
  }
  .play { position: fixed; left: 28px; top: 112px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    backdrop-filter: blur(12px); }
  .play:hover { background: rgba(40, 46, 62, .85); }
  body.playing .play { background: #f3f5f9; color: #111; }
  .prompt { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
    background: rgba(16, 20, 30, .8); color: var(--text); font-size: 14px; pointer-events: none; }
  .stick, .act { display: none; }
  .stick { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; touch-action: none;
    place-items: center; background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .25); }
  .stick .knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .85);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .3); pointer-events: none; }
  .act { position: fixed; right: 20px; bottom: 96px; min-width: 92px; padding: 14px 16px; border: 0; border-radius: 999px;
    background: var(--accent); color: #1d2230; font-family: inherit; font-size: 15px; font-weight: 800; touch-action: manipulation; }
  .act:disabled { opacity: .45; }
  @media (pointer: coarse) {
    body.playing .stick { display: grid; }
    body.playing .act { display: block; }
    body.playing .prompt { display: none; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--dim);
    background: #0b1020; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (max-width: 600px) {
    .panel { left: 12px; right: 12px; bottom: 12px; width: auto; }
    .panel.collapsed { left: auto; }
    .title { left: 16px; top: 14px; }
    .title h1 { font-size: 30px; }
    .cats { top: auto; bottom: 96px; right: 12px; width: 200px; }
    .play { left: 16px; top: 100px; }
    body.playing .cats { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="title">
  <h1>小鎮</h1>
  <p>點路上的人聽他說話，找出躲起來的貓，點噴水池許願。拖曳旋轉，滾輪縮放，右鍵平移。</p>
</div>

<div class="panel">
  <div class="clock">
    <b id="clock">21:00</b><span id="period">夜晚</span>
    <button id="toggle" class="toggle" aria-expanded="true" aria-controls="controls" title="收合（H）">▾</button>
  </div>
  <div id="controls">
  <input id="time" type="range" min="0" max="24" step="0.01" value="21">
  <div class="row">
    <button data-speed="0">暫停</button>
    <button data-speed="60" class="on">60×</button>
    <button data-speed="600">600×</button>
    <button data-speed="3600">3600×</button>
  </div>
  <div class="row">
    <button data-time="7">清晨</button>
    <button data-time="12">中午</button>
    <button data-time="18.2">黃昏</button>
    <button data-time="21">夜晚</button>
  </div>
  <div class="hint">空白鍵暫停 · H 收合面板 · 60× 為每秒經過一分鐘<br>散步模式：WASD 走、Shift 跑、E 互動、C 換角色、P 離開</div>
  </div>
</div>

<div class="cats">
  <div class="cats-head">貓咪 <b id="cat-count">0/8</b></div>
  <div class="cats-row" id="cat-row"></div>
  <div class="cats-head">祝福 <b id="wish-count">0/10</b></div>
  <div class="cats-row wishes" id="wish-row"></div>
  <div class="cats-total" id="cat-total"></div>
</div>

<button id="play" class="play">🚶 散步模式（P）</button>
<div id="prompt" class="prompt" hidden></div>
<div id="stick" class="stick"><div class="knob"></div></div>
<button id="act" class="act" disabled>互動</button>

<div id="banner" class="banner"></div>

<div id="bubble" class="bubble" hidden><b></b><span></span><p></p></div>

<div id="loading">小鎮搭建中…</div>

<script type="module" src="main.js"></script>
</body>
</html>
