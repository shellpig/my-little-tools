# Double-click viewer for video / images / audio.

# Left/Right (or PgUp/PgDn) walk through files of the same kind in the folder.
autocreate-playlist=same

# Open a window even for audio without cover art, so keys still work.
force-window=yes
# Images stay until you switch; the last file in the folder stays open.
image-display-duration=inf
keep-open=yes

hwdec=auto-safe
autofit-larger=90%x90%

# Zoom/pan/rotate made on one image should not carry over to the next.
reset-on-next-file=video-zoom,video-pan-x,video-pan-y,video-rotate

# Resume position only for videos longer than a minute.
[resume-long-video]
profile-cond=p["current-tracks/video"] and not p["current-tracks/video/image"] and (p.duration or 0) > 60
profile-restore=copy
save-position-on-quit=yes
